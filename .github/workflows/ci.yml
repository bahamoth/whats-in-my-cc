name: CI

on:
  pull_request:

# 같은 PR에 push가 이어지면 진행 중이던 run을 취소한다(최신 commit만 검사).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  webui:
    name: WebUI (vitest + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: webui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Run vitest
        run: npm test

      - name: Build (tsc + vite)
        run: npm run build

      # rust-embed compiles webui/dist into the binary, so the Rust job
      # consumes this artifact instead of rebuilding the frontend.
      - uses: actions/upload-artifact@v4
        with:
          name: webui-dist
          path: webui/dist
          if-no-files-found: error

  rust:
    name: Rust (fmt + clippy + test)
    runs-on: ubuntu-latest
    needs: webui
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: webui-dist
          path: webui/dist

      # Installs the channel + components pinned in rust-toolchain.toml.
      - name: Install Rust toolchain
        run: rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: cargo fmt
        run: cargo fmt --check

      - name: cargo clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: cargo test
        run: cargo test
