name: Pricing refresh

# 주 1회 공식 가격 페이지와 pricing.json을 대조한다(스펙 §2.4).
# 변동 → PR 자동 생성(병합은 사람이 — no-self-merge), 파싱 실패 → 이슈, 무변동 → no-op.
on:
  schedule:
    - cron: '17 0 * * 1' # 매주 월 00:17 UTC (정시 혼잡 회피)
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # 단일 호출로 여러 신호를 얻는다(scripts/update-pricing.ts 계약):
      #   - rate drift 있으면 pricing.json을 그 자리에서 갱신(--write)
      #   - 마크다운 diff 표를 stdout에(--markdown, PR 본문으로 사용 — rate 변동 전용)
      #   - 페이지의 미등록 신규 모델은 stderr로 보고(표시명→id 매핑은 사람 판단 필요라
      #     자동추가 불가 → 이슈로)
      #   - exit 코드로 무변동(0)/rate drift·신규 모델·파싱 실패(1)를 신호(--check)
      # 분기 판정:
      #   - rate drift = pricing.json이 실제로 바뀜(git diff) → PR (본문은 clean 마크다운)
      #   - 신규 모델 = stderr에 "new models on page" → 이슈
      #   - 파싱 실패 = exit 1인데 파일 변경도 신규 모델도 없음 → 실패(이슈)
      - name: Check & update pricing.json
        id: pricing
        run: |
          set +e
          node scripts/update-pricing.ts --check --write --markdown > /tmp/pricing-diff.md 2> /tmp/pricing-stderr.txt
          code=$?
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          cat /tmp/pricing-stderr.txt >&2 || true

          if grep -q "new models on page" /tmp/pricing-stderr.txt; then
            grep "new models on page" /tmp/pricing-stderr.txt > /tmp/pricing-new-models.txt
            echo "new_models=true" >> "$GITHUB_OUTPUT"
          else
            echo "new_models=false" >> "$GITHUB_OUTPUT"
          fi

          if ! git diff --quiet -- pricing.json; then
            echo "rate drift detected:"
            cat /tmp/pricing-diff.md
            echo "drift=true" >> "$GITHUB_OUTPUT"
          elif [ "$code" -eq 0 ]; then
            echo "no drift"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          elif grep -q "new models on page" /tmp/pricing-stderr.txt; then
            echo "new models only — no rate drift; opening an issue"
            echo "drift=false" >> "$GITHUB_OUTPUT"
          else
            echo "::error::pricing page parse failed (exit $code) — no pricing.json change, no new models"
            echo "drift=false" >> "$GITHUB_OUTPUT"
            exit 1
          fi

      - name: Open PR with updated pricing.json
        if: steps.pricing.outputs.drift == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          DATE="$(date -u +%F)"
          BRANCH="auto/pricing-refresh-${DATE}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add pricing.json
          git commit -m "fix(pricing): 공개 가격표 갱신 ${DATE}"
          git push origin "$BRANCH"
          gh pr create \
            --title "fix(pricing): 공개 가격표 갱신 ${DATE}" \
            --body-file /tmp/pricing-diff.md

      - name: Open issue for unregistered new models
        if: steps.pricing.outputs.new_models == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "pricing: 페이지에 미등록 신규 모델 $(date -u +%F)" \
            --body "$(cat /tmp/pricing-new-models.txt)

          공개 가격 페이지에 pricing.json 미등록 모델이 있습니다. 페이지는 표시명만 노출해 모델 id 매핑은 사람 판단이 필요하므로 자동 추가하지 않습니다. \`scripts/update-pricing.ts\`의 PAGE_ALIASES와 \`pricing.json\`에 사전 추가하세요(단가 잠금 테스트 동반). Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"

      - name: Open issue on failure
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue create \
            --title "pricing-refresh 실패 $(date -u +%F)" \
            --body "주간 가격표 대조가 실패했습니다 — 페이지 구조 변경/네트워크 오류 가능. 파서(scripts/update-pricing.ts)와 fixture 재동결을 검토하세요. Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
