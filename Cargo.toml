[package]
name = "wimcc"
version = "1.4.0"
edition = "2021"
rust-version = "1.88"
description = "What's in My Claude Code — local-only execution inspection with evidence-linked insight"
license = "MIT OR Apache-2.0"
repository = "https://github.com/bahamoth/whats-in-my-cc"
homepage = "https://github.com/bahamoth/whats-in-my-cc"
readme = "README.md"
# include는 허용목록으로 동작한다 — 여기 없는 파일은 .crate에서 빠진다.
# 컴파일 타임 임베드 3종(webui/dist·pricing.json·migrations)이 근거.
include = [
  "src/**",
  "migrations/**",
  "pricing.json",
  "webui/dist/**",
  "README.md",
  "LICENSE-MIT",
  "LICENSE-APACHE",
]

[[bin]]
name = "wimcc"
path = "src/main.rs"

[lib]
name = "wimcc"
path = "src/lib.rs"

[dependencies]
tokio              = { version = "1.40", features = ["macros","rt-multi-thread","fs","io-util","signal"] }
axum               = { version = "0.7",  features = ["macros","json","tokio"] }
tower              = "0.5"
tower-http         = { version = "0.5",  features = ["trace", "decompression-gzip"] }
sqlx               = { version = "0.8",  default-features = false, features = ["runtime-tokio-rustls","sqlite","macros","migrate","json","chrono"] }
serde              = { version = "1",    features = ["derive"] }
serde_json         = { version = "1",    features = ["raw_value","preserve_order"] }
clap               = { version = "4.5",  features = ["derive","env"] }
tracing            = "0.1"
tracing-subscriber = { version = "0.3",  features = ["env-filter","json"] }
tracing-appender   = "0.2"
ulid               = { version = "1.1",  features = ["serde"] }
chrono             = { version = "0.4",  features = ["serde"] }
anyhow             = "1"
thiserror          = "2"
dirs               = "5"
walkdir            = "2"
futures            = "0.3"
tokio-stream       = { version = "0.1", features = ["io-util", "sync"] }
sha2               = "0.10"
hex                = "0.4"
once_cell          = "1"
rust-embed         = { version = "8", features = ["interpolate-folder-path"] }
mime_guess         = "2"
notify             = "7"
tokio-util         = { version = "0.7",  features = ["rt"] }
reqwest            = { version = "0.12", default-features = false, features = ["json","rustls-tls"] }
strum              = { version = "0.26", features = ["derive"] }
regex              = "1"
async-trait        = "0.1"
rand               = "0.9"
base64             = "0.22"
subtle             = "2"
toml = "1.1.2"
semver             = "1"
axoupdater         = { version = "0.10", default-features = false, features = ["github_releases"] }

[dev-dependencies]
assert-json-diff   = "2"
insta              = { version = "1", features = ["json","redactions"] }
tempfile           = "3"
http-body-util     = "0.1"
axum-test          = "16"
pretty_assertions  = "1"
assert_cmd         = "2"
portpicker         = "0.1"
flate2             = "1"
urlencoding        = "2"

[profile.release]
lto = "thin"

# The profile that 'dist' will build with
[profile.dist]
inherits = "release"
lto = "thin"

[package.metadata.binstall]
# dist가 올리는 GitHub Releases 바이너리를 재사용 — binstall 사용자는 재컴파일하지 않는다
pkg-url = "{ repo }/releases/download/v{ version }/wimcc-{ target }.tar.xz"
pkg-fmt = "txz"
